name: PA2 checks
on:
  push:
    branches: [main, fritz-pa2]
  pull_request:
  workflow_dispatch:
jobs:
  python-and-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Icarus Verilog and pytest
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog && pip install pytest
      - name: All tests (parser, schedulers, RTL, board top level)
        run: python -m pytest -q
      - name: Generate and simulate constrained ASAP
        run: |
          python -m hls examples/fritz/parallel_adders.txt --schedule cons-asap --adders 1 --emit-rtl --test-values A=2,B=3,C=4,D=5
          python scripts/simulate_rtl.py out/parallel_adders_cons-asap_rtl
      - name: Generate and simulate ALAP
        run: |
          python -m hls examples/fritz/professor_run_1.txt --schedule alap --emit-rtl --test-values A=3,B=2
          python scripts/simulate_rtl.py out/professor_run_1_alap_rtl
      - name: Generate and simulate constrained ALAP
        run: |
          python -m hls examples/fritz/wide.txt --schedule cons-alap --adders 1 --muls 1 --emit-rtl --test-values A=1,B=2,C=3,D=4,E=5,F=6,G=2,H=3
          python scripts/simulate_rtl.py out/wide_cons-alap_rtl
      - name: Generate and simulate custom
        run: |
          python -m hls examples/fritz/reassignment.txt --schedule custom --emit-rtl --test-values B=2,C=3,D=4,E=2
          python scripts/simulate_rtl.py out/reassignment_custom_rtl
      - name: Vivado build script dry run
        run: python scripts/build_and_program.py --equations examples/fritz/professor_run_1.txt --scheduler cons-asap --dry-run
